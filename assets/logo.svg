<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2CA8F0"/>
      <stop offset="100%" stop-color="#1A6FC4"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- container card -->
  <rect x="20" y="20" width="200" height="200" rx="44" fill="url(#cardGrad)"/>
  <rect x="20" y="20" width="200" height="110" rx="44" fill="url(#sheen)"/>

  <!-- checklist item 1 (open) -->
  <rect x="56" y="60" width="20" height="20" rx="6" fill="none" stroke="#FFFFFF" stroke-width="3.2"/>
  <rect x="90" y="63" width="96" height="14" rx="7" fill="#FFFFFF" fill-opacity="0.92"/>

  <!-- checklist item 2 (done) -->
  <rect x="56" y="106" width="20" height="20" rx="6" fill="#FFFFFF"/>
  <path d="M60 116 L65 121 L73 109" fill="none" stroke="#1A6FC4" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="90" y="109" width="74" height="14" rx="7" fill="#FFFFFF" fill-opacity="0.55"/>

  <!-- checklist item 3 (open) -->
  <rect x="56" y="152" width="20" height="20" rx="6" fill="none" stroke="#FFFFFF" stroke-width="3.2"/>
  <rect x="90" y="155" width="86" height="14" rx="7" fill="#FFFFFF" fill-opacity="0.92"/>

  <!-- compose / stack badge -->
  <circle cx="196" cy="196" r="34" fill="#0F2942" stroke="#FFFFFF" stroke-width="5"/>
  <rect x="182" y="185" width="28" height="7" rx="3" fill="#FFFFFF" fill-opacity="1"/>
  <rect x="182" y="193" width="28" height="7" rx="3" fill="#FFFFFF" fill-opacity="0.75"/>
  <rect x="182" y="201" width="28" height="7" rx="3" fill="#FFFFFF" fill-opacity="0.5"/>
</svg>
